# SonarCloud analiza (pokreće je .github/workflows/sonar.yml: ručno ili jednom tjedno, samo master).
# Samo informativno: ne pokreće se na pull requestovima i ništa ne blokira.
sonar.organization=artconnect
sonar.projectKey=LD05-fk_Projekt-PROGI
sonar.projectName=ArtConnect

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=backend/src/test/java/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
# testovi se ne broje kao izvorni kod
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.sourceEncoding=UTF-8

sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
