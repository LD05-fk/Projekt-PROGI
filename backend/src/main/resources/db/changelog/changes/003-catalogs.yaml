              - column: { name: position, valueNumeric: 2 }
        - insert:
            tableName: art_fields
            columns:
              - column: { name: id, valueComputed: gen_random_uuid() }
              - column: { name: code, value: skulptura }
              - column: { name: name, value: Skulptura }
              - column: { name: position, valueNumeric: 3 }
        - insert:
            tableName: art_fields
            columns:
              - column: { name: id, valueComputed: gen_random_uuid() }
              - column: { name: code, value: ilustracija }
              - column: { name: name, value: Ilustracija }
              - column: { name: position, valueNumeric: 4 }
        - insert:
            tableName: art_fields
            columns:
              - column: { name: id, valueComputed: gen_random_uuid() }
              - column: { name: code, value: digitalna-umjetnost }
              - column: { name: name, value: Digitalna umjetnost }
              - column: { name: position, valueNumeric: 5 }
        - insert:
            tableName: art_fields
            columns:
              - column: { name: id, valueComputed: gen_random_uuid() }
              - column: { name: code, value: grafika }
              - column: { name: name, value: Grafika }
              - column: { name: position, valueNumeric: 6 }
        - insert:
            tableName: art_fields
            columns:
              - column: { name: id, valueComputed: gen_random_uuid() }
              - column: { name: code, value: keramika }
              - column: { name: name, value: Keramika }
              - column: { name: position, valueNumeric: 7 }
        - insert:
            tableName: art_fields
            columns:
              - column: { name: id, valueComputed: gen_random_uuid() }
              - column: { name: code, value: instalacija }
              - column: { name: name, value: Instalacija }
              - column: { name: position, valueNumeric: 8 }
        - insert:
            tableName: art_fields
            columns:
              - column: { name: id, valueComputed: gen_random_uuid() }
              - column: { name: code, value: video-umjetnost }
              - column: { name: name, value: Video umjetnost }
              - column: { name: position, valueNumeric: 9 }
        - insert:
            tableName: art_fields
            columns:
              - column: { name: id, valueComputed: gen_random_uuid() }
              - column: { name: code, value: ostalo }
              - column: { name: name, value: Ostalo }
              - column: { name: position, valueNumeric: 10 }
      rollback:
        - delete:
            tableName: art_fields
            where: "code in ('slikarstvo', 'fotografija', 'skulptura', 'ilustracija', 'digitalna-umjetnost', 'grafika', 'keramika', 'instalacija', 'video-umjetnost', 'ostalo')"

