databaseChangeLog:
  - changeSet:
      id: FND-03-DB-create-art-fields
      author: lukadimjasevic
      comment: Šifrarnik područja umjetnosti
      changes:
        - createTable:
            tableName: art_fields
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_art_fields
              - column:
                  name: code
                  type: varchar(40)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: ux_art_fields_code
              - column:
                  name: name
                  type: varchar(80)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: ux_art_fields_name
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: position
                  type: smallint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              ALTER TABLE art_fields
              ADD CONSTRAINT ck_art_fields_code CHECK (code ~ '^[a-z0-9-]+$')
      rollback:
        - dropTable:
            tableName: art_fields

