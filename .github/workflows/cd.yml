name: CD

# Isporuka na produkcijski poslužitelj (EC2) nakon uspješnog CI-ja na masteru:
# 1. izgradi i objavi imagee u GitHub Container Registry (uvijek, i kad je poslužitelj ugašen),
# 2. ako poslužitelj radi, preko AWS SSM-a mu naredi da povuče novu inačicu i provjeri /actuator/health.
# Ugašen poslužitelj novu inačicu povuče sam pri sljedećem paljenju (servis artconnect-update).
# Povratak na stariju inačicu: Actions → CD → Run workflow, upisati sha commita.
# Repozitorij je javan, pa se izlaz naredbi s poslužitelja ne ispisuje, samo status.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Sha commita za povratak na stariju inačicu (prazno = izgradi i isporuči trenutni master)'
        type: string
        default: ''

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/ld05-fk
  SITE: https://artconnect-fer.duckdns.org

jobs:
  images:
    name: Imagei
    # nakon CI-ja samo za uspješan push na master; ručno samo kad se ne vraća stara inačica
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/artconnect-backend:${{ env.SHA }}
            ${{ env.REGISTRY }}/artconnect-backend:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Web (frontend + Caddy)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/artconnect-web:${{ env.SHA }}
            ${{ env.REGISTRY }}/artconnect-web:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Isporuka
    needs: images
    # i kad je images preskočen (povratak na stariju inačicu), ali ne kad je pao
    if: >-
      always()
      && (needs.images.result == 'success'
        || (needs.images.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || 'latest' }}
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_CD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_CD_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Stanje poslužitelja
        id: state
        run: |
          state=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Poslužitelj: $state"
          if [ "$state" != "running" ]; then
            echo "Poslužitelj je ugašen ($state); isporuka preskočena. Nova inačica ($TAG) povući će se pri sljedećem paljenju." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Isporuka preko SSM-a
        if: steps.state.outputs.state == 'running'
        run: |
          # TAG je sha ili "latest"; ništa drugo ne smije u naredbu
          [[ "$TAG" =~ ^(latest|[0-9a-f]{7,40})$ ]] || { echo "Neispravan tag: $TAG" >&2; exit 1; }
          params=$(jq -n --arg tag "$TAG" '{commands: [
            "set -e",
            "cd /home/ubuntu/Projekt-PROGI",
            "runuser -u ubuntu -- git pull --ff-only",
            ("sed -i \"/^IMAGE_TAG=/d\" .env && echo IMAGE_TAG=" + $tag + " >> .env"),
            "docker compose -f docker-compose.prod.yml pull backend caddy",
            "docker compose -f docker-compose.prod.yml up -d",
            "docker image prune -f"
          ], executionTimeout: ["900"]}')
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "CD $TAG" \
            --parameters "$params" --query 'Command.CommandId' --output text)
          echo "Naredba poslana ($id), čekam..."
          for i in $(seq 1 90); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) echo "Isporuka: $status"; break ;;
              Pending|InProgress|Delayed) ;;
              *) echo "Isporuka nije uspjela: $status" >&2; exit 1 ;;
            esac
          done
          [ "$status" = Success ] || { echo "Isporuka nije završila u 15 minuta" >&2; exit 1; }

      - name: Provjera zdravlja
        if: steps.state.outputs.state == 'running'
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            "$SITE/actuator/health"
          echo "Isporučena inačica \`$TAG\` radi: $SITE" >> "$GITHUB_STEP_SUMMARY"
